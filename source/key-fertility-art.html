<!doctype html><html><meta charset="utf-8"><style>
html,body{margin:0;width:1760px;height:990px;overflow:hidden;background:#0b0a09}
.plate{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%;filter:contrast(2.1) brightness(0.84) saturate(0.78)}
.vig{position:absolute;inset:0;background:radial-gradient(120% 95% at 50% 55%,transparent 42%,rgba(0,0,0,.62) 100%)}
.block{position:absolute;left:0;right:0;top:23.5%;text-align:center}
.title{margin:0;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:600;text-transform:uppercase;
  font-size:194px;line-height:1;letter-spacing:.16em;padding-left:.16em;display:inline-block;
  background:linear-gradient(#ffcd48 0%,#ff9b30 36%,#ec5a1e 66%,#d2321a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 34px rgba(255,120,40,.38)) drop-shadow(0 4px 12px rgba(0,0,0,.75))}
.rule{width:62%;height:2px;margin:18px auto 0;background:linear-gradient(90deg,transparent,rgba(194,160,106,.5) 20%,#d8ba86 50%,rgba(194,160,106,.5) 80%,transparent);box-shadow:0 0 18px rgba(216,186,134,.35)}
.sub{margin:16px 0 0;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:22px;letter-spacing:.42em;padding-left:.42em;text-transform:uppercase;color:#d8ba86;text-shadow:0 2px 8px rgba(0,0,0,.8)}
</style><body><img class="plate" src="fertility-img/ultrasound.jpg"><div class="vig"></div>
<div class="block"><h1 class="title">Fertility</h1><div class="rule"></div><p class="sub">Coming Soon</p></div></body></html>
